<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auto Income – Stavebné práce</title><style>body{font:18px system-ui;background:#f1f5f3;color:#18352c;margin:32px auto;padding:20px;max-width:650px}form{background:white;padding:24px;border-radius:16px}label{display:block;margin:15px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{background:#185a43;color:white;border:0}</style><h1>Stavebné práce v Bratislave</h1><p>Sadrokartón, obklady a rekonštrukcie.</p><form id="f"><h2>Pripravte si dopyt</h2><label>Typ práce<select name="service"><option>Sadrokartón</option><option>Obklady a dlažby</option><option>Rekonštrukcia</option></select></label><label>Lokalita<input name="area" required></label><label>Popis<textarea name="description" required></textarea></label><button>Vytvoriť návrh</button><p id="out" style="white-space:pre-wrap"></p><small>Testovacia verzia: údaje sa neodosielajú. Nezadávajte osobné údaje.</small></form><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#out').textContent=Array.from(new FormData(e.target).values()).join('\n')};</script></html>
