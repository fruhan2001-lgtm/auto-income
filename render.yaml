services:
  - type: web
    name: auto-income-sk
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auto-income-db
          property: connectionString
databases:
  - name: auto-income-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
    ipAllowList: []
